---
- name: Refuse a root-scoped personal install
  ansible.builtin.assert:
    that:
      - ansible_facts['user_id'] != 'root'
    fail_msg: >-
      hyperkeyd is a per-user desktop service. Run this installer as the target
      desktop user rather than installing it into root's home directory.

- name: Inspect required Cargo project files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hyperkeyd_source_dir }}/Cargo.toml"
    - "{{ hyperkeyd_source_dir }}/Cargo.lock"
  register: hyperkeyd_source_files
  changed_when: false

- name: Require the expected hyperkeyd source checkout
  ansible.builtin.assert:
    that:
      - hyperkeyd_source_files.results | length == 2
      - hyperkeyd_source_files.results[0].stat.isreg | default(false)
      - hyperkeyd_source_files.results[1].stat.isreg | default(false)
    fail_msg: >-
      hyperkeyd_source_dir must point at a checkout containing Cargo.toml and
      Cargo.lock.

- name: Verify Cargo is available
  ansible.builtin.command:
    argv:
      - cargo
      - --version
  register: hyperkeyd_cargo_version
  changed_when: false
  check_mode: false

- name: Ensure the user-local binary directory exists
  ansible.builtin.file:
    path: "{{ hyperkeyd_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure the Hyper command directory exists without managing its contents
  ansible.builtin.file:
    path: "{{ hyperkeyd_script_dir }}"
    state: directory

- name: Ensure the hyperkeyd configuration directory exists
  ansible.builtin.file:
    path: "{{ hyperkeyd_config_dir }}"
    state: directory
    mode: '0755'

- name: Ensure the systemd user-unit directory exists
  ansible.builtin.file:
    path: "{{ hyperkeyd_systemd_user_dir }}"
    state: directory
    mode: '0755'

- name: Inspect existing machine enrollment configuration
  ansible.builtin.stat:
    path: "{{ hyperkeyd_config_path }}"
  register: hyperkeyd_existing_config
  changed_when: false

- name: Reject an unusable machine enrollment file
  ansible.builtin.assert:
    that:
      - not hyperkeyd_existing_config.stat.exists or (hyperkeyd_existing_config.stat.isreg | default(false))
      - not hyperkeyd_existing_config.stat.exists or ((hyperkeyd_existing_config.stat.size | default(0) | int) > 0)
    fail_msg: >-
      {{ hyperkeyd_config_path }} exists but is not a non-empty regular file.
      Re-run hyperkeyd setup to create a verified machine enrollment.

- name: Report preservation of existing machine enrollment
  ansible.builtin.debug:
    msg: >-
      Existing machine enrollment at {{ hyperkeyd_config_path }} is preserved;
      this installer does not rewrite setup-generated configuration.
  when: hyperkeyd_existing_config.stat.exists

- name: Explain binary handling in check mode
  ansible.builtin.debug:
    msg: >-
      Check mode does not compile Rust or replace the installed binary. Directory,
      enrollment, unit-file, and existing service state are still evaluated.
  when: ansible_check_mode

- name: Build the locked release binary
  ansible.builtin.command:
    argv:
      - cargo
      - build
      - --release
      - --locked
    chdir: "{{ hyperkeyd_source_dir }}"
  register: hyperkeyd_build
  changed_when: false
  when: not ansible_check_mode

- name: Inspect the compiled release binary
  ansible.builtin.stat:
    path: "{{ hyperkeyd_source_dir }}/target/release/hyperkeyd"
  register: hyperkeyd_compiled_binary
  changed_when: false
  when: not ansible_check_mode

- name: Require a compiled release binary
  ansible.builtin.assert:
    that:
      - hyperkeyd_compiled_binary.stat.isreg | default(false)
      - hyperkeyd_compiled_binary.stat.executable | default(false)
    fail_msg: >-
      cargo build completed without producing an executable
      target/release/hyperkeyd binary.
  when: not ansible_check_mode

- name: Install hyperkeyd into the user-local binary directory
  ansible.builtin.copy:
    src: "{{ hyperkeyd_source_dir }}/target/release/hyperkeyd"
    dest: "{{ hyperkeyd_binary_path }}"
    remote_src: true
    mode: '0755'
  notify: Restart hyperkeyd user service
  when: not ansible_check_mode

- name: Inspect the currently installed user-service unit
  ansible.builtin.stat:
    path: "{{ hyperkeyd_service_path }}"
  register: hyperkeyd_service_before
  changed_when: false

- name: Install the config-driven hyperkeyd user-service unit
  ansible.builtin.template:
    src: hyperkeyd.service.j2
    dest: "{{ hyperkeyd_service_path }}"
    mode: '0644'
  notify:
    - Reload hyperkeyd user systemd
    - Restart hyperkeyd user service

- name: Apply pending user-service handlers before service-state checks
  ansible.builtin.meta: flush_handlers

- name: Explain prospective service handling in check mode
  ansible.builtin.debug:
    msg: >-
      The managed unit does not exist yet, so check mode cannot ask systemd for
      its future enabled/running state. A live run will daemon-reload and manage
      the new unit after writing it.
  when:
    - ansible_check_mode
    - hyperkeyd_existing_config.stat.isreg | default(false)
    - (hyperkeyd_existing_config.stat.size | default(0) | int) > 0
    - not (hyperkeyd_service_before.stat.exists | default(false))

- name: Ensure the enrolled hyperkeyd user service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ hyperkeyd_service_name }}"
    scope: user
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "{{ hyperkeyd_xdg_runtime_dir }}"
  register: hyperkeyd_service_state
  when:
    - hyperkeyd_existing_config.stat.isreg | default(false)
    - (hyperkeyd_existing_config.stat.size | default(0) | int) > 0
    - not ansible_check_mode or (hyperkeyd_service_before.stat.exists | default(false))

- name: Verify the managed hyperkeyd service is active
  ansible.builtin.assert:
    that:
      - hyperkeyd_service_state.status.ActiveState | default('') == 'active'
    fail_msg: >-
      {{ hyperkeyd_service_name }} did not reach the active state after the
      installer managed it.
  when:
    - not ansible_check_mode
    - hyperkeyd_existing_config.stat.isreg | default(false)
    - (hyperkeyd_existing_config.stat.size | default(0) | int) > 0

- name: Explain keyboard-enrollment next step
  ansible.builtin.debug:
    msg: |-
      hyperkeyd is installed, but this machine has not been enrolled yet.

      Next, run:
        {{ hyperkeyd_binary_path }} setup

      When setup succeeds, rerun:
        ansible-playbook playbooks/install.yml

      The service unit is installed but will remain disabled and stopped until
      verified machine enrollment exists.
  when:
    - not ansible_check_mode
    - not hyperkeyd_existing_config.stat.exists
